name: Refresh advisories

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: refresh-advisories
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4 # provides fly.toml
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Starts a temporary machine from the latest deployed image (with the
      # app's secrets), runs the import, then destroys the machine.
      - run: flyctl console --command "/rails/bin/rails advisories:refresh"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Pages are cached at Cloudflare until the next refresh (see
      # ApplicationController#allow_edge_caching); clear them so the new data
      # shows immediately. Skipped until the Cloudflare secrets are set.
      - name: Purge Cloudflare cache
        if: ${{ env.CLOUDFLARE_ZONE_ID != '' }}
        env:
          PURGE_HOST: travel-advisories.jfd.is
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"${PURGE_HOST}\"]}"
